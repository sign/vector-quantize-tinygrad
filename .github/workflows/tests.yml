name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lfq-compatibility:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Install reference implementation
        run: python -m pip install vector-quantize-pytorch

      - name: Install tinygrad from source
        run: python -m pip install git+https://github.com/tinygrad/tinygrad.git

      - name: Install package
        run: python -m pip install -e .

      - name: Run LFQ compatibility tests
        run: python tests/test_lfq.py
