[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-quantize-tinygrad"
version = "0.1.0"
description = "tinygrad port of the LFQ module from vector-quantize-pytorch"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "vector-quantize-tinygrad contributors" },
]
keywords = ["tinygrad", "vector quantization", "lfq", "quantization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "tinygrad",
]

[project.optional-dependencies]
test = [
  "vector-quantize-pytorch",
]

[project.urls]
Homepage = "https://github.com/sign/vector-quantize-tinygrad"
Repository = "https://github.com/sign/vector-quantize-tinygrad"
Issues = "https://github.com/sign/vector-quantize-tinygrad/issues"

[tool.setuptools.packages.find]
include = ["vector_quantize_tinygrad*"]
